[package]
name = "ble-scanner-trevm"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ariel-os = { workspace = true, features = ["time"] }
ariel-os-bindings = { workspace = true, features = ["log"] }
ariel-os-boards = { workspace = true }

embassy-futures = { version = "0.1.1" }
trouble-host = { workspace = true, features = ["derive", "scan"] }
wasmtime = { workspace = true, default-features = false, features = [
  "component-model",
  "pulley",
  "runtime",
] }

[lints]
workspace = true
