[package]
name = "ariel-os-bindings"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ariel-os-alloc = { workspace = true }
ariel-os-embassy = { workspace = true, optional = true }
ariel-os-hal = { workspace = true, optional = true }
ariel-os-log = { workspace = true, optional = true }
ariel-os-random = { workspace = true, optional = true }
ariel-os-sensors = { workspace = true, optional = true }
ariel-os-sensors-registry = { workspace = true, optional = true }

embassy-futures = { version = "0.1.1", default-features = false, optional = true }

# Using v 0.13 instead of v 0.14 because v0.14 relies on rand_core 0.10 which Ariel OS does not support.
# v 0.13 uses rand_core 0.6.4 which is one of the two versions of the rand_core traits that Ariel support.
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
# Crypto-common is only usedful with k256 >= 0.14
# crypto-common = { version = "0.2.2", default-features = false }
rand_core = { workspace = true, optional = true }

wasmtime = { workspace = true, default-features = false, features = [
  "component-model",
  "runtime",
] }

[features]
rng = ["dep:ariel-os-random", "dep:rand_core"]
udp = ["ariel-os-embassy/net", "ariel-os-embassy/udp", "dep:embassy-futures"]
time = ["ariel-os-embassy/time", "async"]
log = ["dep:ariel-os-log"]
async = ["wasmtime/async"]
gpio = ["dep:ariel-os-hal"]
sensors = [
  "dep:ariel-os-sensors",
  "dep:ariel-os-sensors-registry",
  "dep:embassy-futures",
]
sensors-async = ["async", "sensors", "dep:ariel-os-log"]

wasm-card = ["ariel-os-random/csprng", "dep:ariel-os-log"]

[lints]
workspace = true
