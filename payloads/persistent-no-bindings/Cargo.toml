[package]
name = "persistent-no-bindings"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
coap-handler = "0.2.0"
coap-handler-implementations = "0.6.1"

coap-message = "0.3.2"
coap-message-implementations = "0.1.8"
coap-message-utils = "0.3.0"

coap-numbers = "0.2.2"

talc = { version = "4.4.3", default-features = false, features = ["lock_api"] }

wit-bindgen = { version = "0.47.0", default-features = false, features = [
  "macros",
] }
